name: Deploy AirMath AI to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test math
        run: node tests/math.test.mjs
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html style.css _site/
          cp -r src _site/
          touch _site/.nojekyll
          sed -i "s/?v=3/?v=${GITHUB_SHA}/g" _site/index.html
      # One-time setup: Repository Settings → Pages → Source → GitHub Actions.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
